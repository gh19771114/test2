<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#0f2a4a"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1200" height="800" rx="48" fill="url(#bg)"/>
  <path d="M 0 140 C 220 40, 540 210, 780 120 C 1020 30, 1120 70, 1200 150 L 1200 0 L 0 0 Z" fill="url(#shine)"/>

  <g opacity="0.16" fill="#fff">
    <circle cx="220" cy="640" r="120"/>
    <circle cx="1030" cy="180" r="95"/>
    <circle cx="980" cy="690" r="60"/>
  </g>

  <g transform="translate(110,120)" filter="url(#shadow)">
    <rect x="0" y="0" width="980" height="560" rx="44" fill="#0b1220" fill-opacity="0.25" stroke="#fff" stroke-opacity="0.22"/>
    <!-- simple “building + pin” icon -->
    <g transform="translate(96,110)" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="10" width="190" height="190" rx="22"/>
      <path d="M55 200 V55 h80 v145"/>
      <path d="M55 88 h80"/>
      <path d="M78 88 v112"/>
      <path d="M112 88 v112"/>
      <path d="M250 130c0-28 22-50 50-50s50 22 50 50c0 42-50 92-50 92s-50-50-50-92z"/>
      <circle cx="300" cy="130" r="16"/>
    </g>

    <g transform="translate(96,360)" fill="#fff">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="56" font-weight="800">ライオンズマンション東銀座 2F</text>
      <text x="0" y="64" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="600" opacity="0.9">Ginza × Tsukiji • Corner Unit / Office & Retail</text>
    </g>
  </g>

  <g transform="translate(110,720)" fill="#fff" opacity="0.85">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans', sans-serif" font-size="22">Bourn Mark • Property Card</text>
  </g>
</svg>
